name: QGIS Python checks

on:
  pull_request:
    paths:
      - "scripts/**"
      - "raster-crs/**"
      - "tests/**"
      - "ruff.toml"
      - "pyrightconfig.json"
      - "pyright-ci.json"
      - ".github/workflows/qgis-python-qa.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "raster-crs/**"
      - "tests/**"
      - "ruff.toml"
      - "pyrightconfig.json"
      - "pyright-ci.json"
      - ".github/workflows/qgis-python-qa.yml"

jobs:
  maintained-python:
    name: QGIS 4 Python 3.12 static and headless tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned development tools and QGIS 4 type stubs
        run: python -m pip install ruff==0.16.6 pyright==1.1.414 pytest==9.1.1 qgis-stubs==1.0.0.dev2
      - name: Ruff lint all repository QGIS Python
        run: python -m ruff check scripts raster-crs tests
      - name: Ruff format all repository QGIS Python
        run: python -m ruff format --check scripts raster-crs tests
      - name: Strict Pyright on QGIS-independent code
        run: python -m pyright -p pyright-ci.json
      - name: Strict Pyright for maintained QGIS 4 utilities
        run: python -m pyright -p pyrightconfig.json
      - name: Test pure Python logic (QGIS mocked)
        run: python -m pytest tests -q
