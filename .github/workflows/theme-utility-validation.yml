name: Validate QGIS theme utility

on:
  pull_request:
    paths:
      - "scripts/LotsOfThemes/**"
      - ".github/workflows/theme-utility-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/LotsOfThemes/**"
      - ".github/workflows/theme-utility-validation.yml"

jobs:
  validate:
    name: Headless theme utility checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: python -m pip install "ruff==0.16.6" "pytest>=8,<10"
      - name: Check lint
        run: |
          python -m ruff check --isolated --target-version py314 --select E,F,W,B,UP,EM,PTH,FURB,I \
            scripts/LotsOfThemes/create_new_themes_from_list.py \
            scripts/LotsOfThemes/tests/test_theme_index.py
      - name: Check formatting
        run: |
          python -m ruff format --isolated --line-length 120 --check \
            scripts/LotsOfThemes/create_new_themes_from_list.py \
            scripts/LotsOfThemes/tests/test_theme_index.py
      - name: Test theme metadata without QGIS
        run: python -m pytest scripts/LotsOfThemes/tests -q
